# DeviceVault orchestrator: web UI, API, result consumers and worker events.
#
#   cp orchestrator.env.example orchestrator.env   # then edit
#   docker compose up -d
#   docker compose --profile flower up -d          # ... plus Flower, proxied at /flower/local/
#
# Infrastructure (RabbitMQ, Redis, PostgreSQL) is deployed separately; see
# deploy/infra. "host.docker.internal" resolves to this host, for infra
# running on the same machine.

name: devicevault-orchestrator

x-orchestrator: &orchestrator
  image: ${DV_ORCHESTRATOR_IMAGE:-devicevault-orchestrator:latest}
  restart: unless-stopped
  env_file: [orchestrator.env]
  volumes:
    - data:/var/lib/devicevault
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-after-migrate: &after-migrate
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  migrate:
    <<: *orchestrator
    command: [migrate]
    restart: "no"

  api:
    <<: [*orchestrator, *after-migrate]
    command: [api]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  scheduler:
    <<: [*orchestrator, *after-migrate]
    command: [scheduler]

  events:
    <<: [*orchestrator, *after-migrate]
    command: [events]

  web:
    image: ${DV_WEB_IMAGE:-devicevault-web:latest}
    restart: unless-stopped
    ports:
      - "${DV_HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

  # Add it under Admin Settings > Flower as slug "local", URL http://flower:5555,
  # proxied: the web service then serves it at /flower/local/ to administrators.
  # Its own port is unauthenticated, so it is published on loopback only.
  flower:
    <<: *orchestrator
    profiles: [flower]
    command: [flower]
    environment:
      DV_FLOWER_URL_PREFIX: ${DV_FLOWER_URL_PREFIX:-flower/local}
    ports:
      - "127.0.0.1:${DV_FLOWER_PORT:-5555}:5555"

volumes:
  data:
