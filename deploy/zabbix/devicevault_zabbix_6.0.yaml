      name: DeviceVault Device by HTTP
      description: |-
        DeviceVault backup status of this device, matched on its address ({HOST.IP}) or {$DV.DEVICE.ID}.

        Link it to the device hosts Zabbix already monitors. {$DV.RELAY.URL} is the monitoring relay on a DeviceVault receiver
        in the zone of the proxy that monitors the host (set it once per zone on a site template that links this one), or
        {$DV.URL}/api/monitoring where the proxy can reach DeviceVault directly. {$DV.TOKEN} (a service account's token with
        the monitoring scope) is meant to be a global macro.

        Generated by DeviceVault from its metric catalogue; see DEPLOYMENT.md, section Monitoring.
      groups:
        - name: Templates/Applications
      items:
        - uuid: ca96cacc609e469094c7c3c06ff3ac51
          name: 'DeviceVault: Get device status'
          type: HTTP_AGENT
          key: dv.device.get
          delay: '{$DV.DEVICE.INTERVAL}'
          history: 1h
          trends: '0'
          value_type: TEXT
          description: The device's answer from DeviceVault's published snapshot (503 when the snapshot is stale).
          timeout: 15s
          url: '{$DV.RELAY.URL}/device/?ip={HOST.IP}&id={$DV.DEVICE.ID}'
          headers:
            - name: Authorization
              value: Bearer {$DV.TOKEN}
          tags:
            - tag: component
              value: raw
          status_codes: 200,503
          verify_peer: 'NO'
          verify_host: 'NO'
        - uuid: 0b705a2ff03d4b6abf9c05b3b87b0fce
          name: 'DeviceVault: Answer error'
          type: DEPENDENT
          key: dv.device.error
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: '"stale" when the relay has no current snapshot (503), otherwise "none".'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.error
              error_handler: CUSTOM_VALUE
              error_handler_params: none
          master_item:
            key: dv.device.get
          tags:
            - tag: component
              value: api
        - uuid: 2f38def1d45148ea81892889eb3fcd7c
          name: 'DeviceVault: Found in DeviceVault'
          type: DEPENDENT
          key: dv.device.found
          delay: '0'
          value_type: UNSIGNED
          description: 1 when the address or id matches a device the token may see
          valuemap:
            name: DeviceVault yes/no
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.found
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: dv.device.get
          tags:
            - tag: component
              value: backup
          triggers:
            - uuid: f6d1caf6791f45e0846e4df9b722fe64
              expression: last(/DeviceVault Device by HTTP/dv.device.found)=0 and {$DV.NOTFOUND.ALERT}=1
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: last(/DeviceVault Device by HTTP/dv.device.found)=1 or {$DV.NOTFOUND.ALERT}=0
              name: 'DeviceVault: not backed up by DeviceVault'
              priority: INFO
              description: No device DeviceVault backs up (and the token may see) has this address or id. Set {$DV.NOTFOUND.ALERT} to 0 on hosts that are not meant to be backed up.
              dependencies:
                - name: 'DeviceVault: no data from DeviceVault'
                  expression: nodata(/DeviceVault Device by HTTP/dv.device.get,{$DV.DEVICE.NODATA})=1 or last(/DeviceVault Device by HTTP/dv.device.error)="stale"
                  recovery_expression: nodata(/DeviceVault Device by HTTP/dv.device.get,{$DV.DEVICE.NODATA})=0 and last(/DeviceVault Device by HTTP/dv.device.error)<>"stale"
              tags:
                - tag: component
                  value: backup
                - tag: scope
                  value: notice
                - tag: group
                  value: all
        - uuid: 40a1efbd13964034b8c293dea346e521
