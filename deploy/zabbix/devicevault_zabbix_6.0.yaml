        - macro: '{$DV.NODATA}'
          value: 5m
          description: No answer from the monitoring API for this long raises the unreachable trigger.
        - macro: '{$DV.SUCCESS.MIN}'
          value: '95'
          description: Lowest acceptable share of backups stored over 24h, in percent.
        - macro: '{$DV.STALE.MAX}'
          value: 2d
          description: Longest acceptable age of the oldest last successful backup in a device group.
        - macro: '{$DV.FAIL.CONSEC}'
          value: '3'
          description: Consecutive failures that count a device as failing (rounded down to 1, 3 or 5).
        - macro: '{$DV.DURATION.MAX}'
          value: 10m
          description: Longest acceptable 95th percentile request-to-stored time over 24h.
        - macro: '{$DV.WORKER.HEARTBEAT.MAX}'
          value: 3m
          description: Longest acceptable gap between an approved worker's heartbeats.
        - macro: '{$DV.PENDING.MAX}'
          value: 1h
          description: Longest a worker may wait for approval before it is reported.
        - macro: '{$DV.SKEW.MAX}'
          value: '60'
          description: Largest acceptable difference between the DeviceVault and Zabbix clocks, in seconds.
        - macro: '{$DV.PUSH.REFUSED.MAX}'
          value: '10'
          description: More refused pushes than this within an hour raise a trigger.
