                  expression: min(/DeviceVault by HTTP/dv.worker.assignment_behind[{#ID}],10m)=1 and last(/DeviceVault by HTTP/dv.worker.assignment_behind[{#ID}],#1:now-10m)=1
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: last(/DeviceVault by HTTP/dv.worker.assignment_behind[{#ID}])=0
                  name: 'DeviceVault: worker {#NAME}: assignment behind for 10 minutes'
                  priority: WARNING
