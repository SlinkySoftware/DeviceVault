                      recovery_expression: last(/DeviceVault by HTTP/dv.http.status)=200 and nodata(/DeviceVault by HTTP/dv.http.status,{$DV.NODATA})=0
                    - name: 'DeviceVault: monitoring figures are stale'
                      expression: last(/DeviceVault by HTTP/dv.computed_age)>3*{$DV.INTERVAL} or nodata(/DeviceVault by HTTP/dv.server_time,{$DV.NODATA})=1
                      recovery_expression: last(/DeviceVault by HTTP/dv.computed_age)<=3*{$DV.INTERVAL} and nodata(/DeviceVault by HTTP/dv.server_time,{$DV.NODATA})=0
                  tags:
