              description: No scheduler node holds the lease, so no scheduled backup starts.
              dependencies:
                - name: 'DeviceVault: monitoring API unreachable or refusing'
                  expression: last(/DeviceVault by HTTP/dv.http.status)<>200 or nodata(/DeviceVault by HTTP/dv.http.status,{$DV.NODATA})=1
                  recovery_expression: last(/DeviceVault by HTTP/dv.http.status)=200 and nodata(/DeviceVault by HTTP/dv.http.status,{$DV.NODATA})=0
                - name: 'DeviceVault: monitoring figures are stale'
                  expression: last(/DeviceVault by HTTP/dv.computed_age)>3*{$DV.INTERVAL} or nodata(/DeviceVault by HTTP/dv.server_time,{$DV.NODATA})=1
                  recovery_expression: last(/DeviceVault by HTTP/dv.computed_age)<=3*{$DV.INTERVAL} and nodata(/DeviceVault by HTTP/dv.server_time,{$DV.NODATA})=0
              tags:
                - tag: component
                  value: scheduler
                - tag: scope
                  value: availability
                - tag: group
                  value: all
        - uuid: b56f370402974734b2c398f97e7b4372
          name: 'DeviceVault: Scheduler lease remaining'
          type: DEPENDENT
          key: dv.scheduler_lease_ttl
          delay: '0'
          value_type: FLOAT
          units: s
          description: Seconds left on the leader's lease (0 without a leader)
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.scheduler_lease_ttl
              error_handler: DISCARD_VALUE
          master_item:
            key: dv.summary.get
          tags:
            - tag: component
              value: platform
        - uuid: 4ab08602bc5e4ab28b73ed9449946919
          name: 'DeviceVault: Scheduler last tick, age'
          type: DEPENDENT
          key: dv.scheduler_tick_age
          delay: '0'
          value_type: FLOAT
          units: s
          description: Seconds since the leader last ran its tick (-1 if it never has)
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.scheduler_tick_age
              error_handler: DISCARD_VALUE
          master_item:
            key: dv.summary.get
          tags:
            - tag: component
              value: platform
          triggers:
            - uuid: 0ba886097e6a4a2baac33c52bbde0969
              expression: last(/DeviceVault by HTTP/dv.scheduler_tick_age)>2m or last(/DeviceVault by HTTP/dv.scheduler_tick_age)<0
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: last(/DeviceVault by HTTP/dv.scheduler_tick_age)>=0 and last(/DeviceVault by HTTP/dv.scheduler_tick_age)<=2m
              name: 'DeviceVault: scheduler is not ticking'
              priority: AVERAGE
              description: The scheduler leader has not run its tick for over 2 minutes.
              dependencies:
                - name: 'DeviceVault: monitoring API unreachable or refusing'
                  expression: last(/DeviceVault by HTTP/dv.http.status)<>200 or nodata(/DeviceVault by HTTP/dv.http.status,{$DV.NODATA})=1
                  recovery_expression: last(/DeviceVault by HTTP/dv.http.status)=200 and nodata(/DeviceVault by HTTP/dv.http.status,{$DV.NODATA})=0
                - name: 'DeviceVault: monitoring figures are stale'
                  expression: last(/DeviceVault by HTTP/dv.computed_age)>3*{$DV.INTERVAL} or nodata(/DeviceVault by HTTP/dv.server_time,{$DV.NODATA})=1
                  recovery_expression: last(/DeviceVault by HTTP/dv.computed_age)<=3*{$DV.INTERVAL} and nodata(/DeviceVault by HTTP/dv.server_time,{$DV.NODATA})=0
                - name: 'DeviceVault: scheduler has no leader'
                  expression: last(/DeviceVault by HTTP/dv.scheduler_leader)=0
                  recovery_expression: last(/DeviceVault by HTTP/dv.scheduler_leader)=1
              tags:
                - tag: component
                  value: scheduler
                - tag: scope
                  value: availability
                - tag: group
                  value: all
