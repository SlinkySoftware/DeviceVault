  triggers:
    - uuid: 5f7ec9745d7e4ec6805dac9604d8e610
      expression: last(/DeviceVault by HTTP/dv.computed_age)>3*{$DV.INTERVAL} or nodata(/DeviceVault by HTTP/dv.server_time,{$DV.NODATA})=1
      recovery_mode: RECOVERY_EXPRESSION
      recovery_expression: last(/DeviceVault by HTTP/dv.computed_age)<=3*{$DV.INTERVAL} and nodata(/DeviceVault by HTTP/dv.server_time,{$DV.NODATA})=0
      name: 'DeviceVault: monitoring figures are stale'
      priority: WARNING
      description: The figures are older than three poll intervals, or none arrived for {$DV.NODATA}.
      dependencies:
        - name: 'DeviceVault: monitoring API unreachable or refusing'
          expression: last(/DeviceVault by HTTP/dv.http.status)<>200 or nodata(/DeviceVault by HTTP/dv.http.status,{$DV.NODATA})=1
          recovery_expression: last(/DeviceVault by HTTP/dv.http.status)=200 and nodata(/DeviceVault by HTTP/dv.http.status,{$DV.NODATA})=0
      tags:
        - tag: component
          value: api
        - tag: scope
          value: availability
        - tag: group
          value: all
    - uuid: 262d6d188d60400ba208aca504a25c50
      expression: last(/DeviceVault by HTTP/dv.success_ratio_24h)<{$DV.SUCCESS.MIN} and last(/DeviceVault by HTTP/dv.finished_24h)>0
      recovery_mode: RECOVERY_EXPRESSION
      recovery_expression: last(/DeviceVault by HTTP/dv.success_ratio_24h)>={$DV.SUCCESS.MIN} or last(/DeviceVault by HTTP/dv.finished_24h)=0
      name: 'DeviceVault: success ratio below {$DV.SUCCESS.MIN}% (24h)'
      opdata: 'Success ratio: {ITEM.LASTVALUE1}'
      priority: WARNING
      description: Fewer backups than {$DV.SUCCESS.MIN}% of those that finished in the last 24h were stored.
      dependencies:
        - name: 'DeviceVault: monitoring API unreachable or refusing'
          expression: last(/DeviceVault by HTTP/dv.http.status)<>200 or nodata(/DeviceVault by HTTP/dv.http.status,{$DV.NODATA})=1
          recovery_expression: last(/DeviceVault by HTTP/dv.http.status)=200 and nodata(/DeviceVault by HTTP/dv.http.status,{$DV.NODATA})=0
        - name: 'DeviceVault: monitoring figures are stale'
          expression: last(/DeviceVault by HTTP/dv.computed_age)>3*{$DV.INTERVAL} or nodata(/DeviceVault by HTTP/dv.server_time,{$DV.NODATA})=1
          recovery_expression: last(/DeviceVault by HTTP/dv.computed_age)<=3*{$DV.INTERVAL} and nodata(/DeviceVault by HTTP/dv.server_time,{$DV.NODATA})=0
      tags:
        - tag: component
          value: backups
        - tag: scope
          value: notice
        - tag: group
          value: all
    - uuid: d0f52a03ad3142c3810fd1ce8e0f0dba
      expression: last(/DeviceVault by HTTP/dv.duration_total_p95)>{$DV.DURATION.MAX} and last(/DeviceVault by HTTP/dv.finished_24h)>0
      recovery_mode: RECOVERY_EXPRESSION
      recovery_expression: last(/DeviceVault by HTTP/dv.duration_total_p95)<={$DV.DURATION.MAX} or last(/DeviceVault by HTTP/dv.finished_24h)=0
      name: 'DeviceVault: backups are slow (p95 over {$DV.DURATION.MAX})'
      opdata: 'p95: {ITEM.LASTVALUE1}'
      priority: WARNING
      description: The 95th percentile request-to-stored time of the last 24h is above {$DV.DURATION.MAX}.
      dependencies:
        - name: 'DeviceVault: monitoring API unreachable or refusing'
          expression: last(/DeviceVault by HTTP/dv.http.status)<>200 or nodata(/DeviceVault by HTTP/dv.http.status,{$DV.NODATA})=1
          recovery_expression: last(/DeviceVault by HTTP/dv.http.status)=200 and nodata(/DeviceVault by HTTP/dv.http.status,{$DV.NODATA})=0
        - name: 'DeviceVault: monitoring figures are stale'
          expression: last(/DeviceVault by HTTP/dv.computed_age)>3*{$DV.INTERVAL} or nodata(/DeviceVault by HTTP/dv.server_time,{$DV.NODATA})=1
          recovery_expression: last(/DeviceVault by HTTP/dv.computed_age)<=3*{$DV.INTERVAL} and nodata(/DeviceVault by HTTP/dv.server_time,{$DV.NODATA})=0
      tags:
        - tag: component
          value: timing
        - tag: scope
          value: performance
        - tag: group
          value: all
    - uuid: fa2f7d0d147341349b66ca380fcd7468
      expression: nodata(/DeviceVault Device by HTTP/dv.device.get,{$DV.DEVICE.NODATA})=1 or last(/DeviceVault Device by HTTP/dv.device.error)="stale"
      recovery_mode: RECOVERY_EXPRESSION
      recovery_expression: nodata(/DeviceVault Device by HTTP/dv.device.get,{$DV.DEVICE.NODATA})=0 and last(/DeviceVault Device by HTTP/dv.device.error)<>"stale"
      name: 'DeviceVault: no data from DeviceVault'
      priority: WARNING
      description: The relay at {$DV.RELAY.URL} did not answer for {$DV.DEVICE.NODATA}, refused the token, or has no current snapshot (503 stale). The other DeviceVault triggers of this host depend on this one.
      tags:
        - tag: component
          value: api
        - tag: scope
          value: availability
        - tag: group
          value: all
    - uuid: 5ccbaa48f4f34b5999d0c20e5d6e67d5
      expression: last(/DeviceVault Device by HTTP/dv.device.overdue)=1 and last(/DeviceVault Device by HTTP/dv.device.found)=1 and last(/DeviceVault Device by HTTP/dv.device.enabled)=1 and last(/DeviceVault Device by HTTP/dv.device.lifecycle_code)=0
      recovery_mode: RECOVERY_EXPRESSION
      recovery_expression: last(/DeviceVault Device by HTTP/dv.device.overdue)=0 or last(/DeviceVault Device by HTTP/dv.device.found)<>1 or last(/DeviceVault Device by HTTP/dv.device.enabled)<>1 or last(/DeviceVault Device by HTTP/dv.device.lifecycle_code)<>0
      name: 'DeviceVault: backup overdue'
      priority: WARNING
      description: The last successful backup is older than the schedule allows.
      dependencies:
        - name: 'DeviceVault: no data from DeviceVault'
          expression: nodata(/DeviceVault Device by HTTP/dv.device.get,{$DV.DEVICE.NODATA})=1 or last(/DeviceVault Device by HTTP/dv.device.error)="stale"
          recovery_expression: nodata(/DeviceVault Device by HTTP/dv.device.get,{$DV.DEVICE.NODATA})=0 and last(/DeviceVault Device by HTTP/dv.device.error)<>"stale"
      tags:
        - tag: component
          value: backup
        - tag: scope
          value: notice
        - tag: group
          value: all
    - uuid: a9bfb97f075c4a22aa3121faeba05a68
      expression: last(/DeviceVault Device by HTTP/dv.device.consecutive_failures)>={$DV.DEVICE.FAIL.CONSEC} and last(/DeviceVault Device by HTTP/dv.device.found)=1 and last(/DeviceVault Device by HTTP/dv.device.enabled)=1 and last(/DeviceVault Device by HTTP/dv.device.lifecycle_code)=0
      recovery_mode: RECOVERY_EXPRESSION
      recovery_expression: last(/DeviceVault Device by HTTP/dv.device.consecutive_failures)<{$DV.DEVICE.FAIL.CONSEC} or last(/DeviceVault Device by HTTP/dv.device.found)<>1 or last(/DeviceVault Device by HTTP/dv.device.enabled)<>1 or last(/DeviceVault Device by HTTP/dv.device.lifecycle_code)<>0
      name: 'DeviceVault: backup failing'
      opdata: 'Consecutive failures: {ITEM.LASTVALUE1}'
      priority: WARNING
      description: The last {$DV.DEVICE.FAIL.CONSEC} or more backups failed.
      dependencies:
        - name: 'DeviceVault: no data from DeviceVault'
          expression: nodata(/DeviceVault Device by HTTP/dv.device.get,{$DV.DEVICE.NODATA})=1 or last(/DeviceVault Device by HTTP/dv.device.error)="stale"
          recovery_expression: nodata(/DeviceVault Device by HTTP/dv.device.get,{$DV.DEVICE.NODATA})=0 and last(/DeviceVault Device by HTTP/dv.device.error)<>"stale"
      tags:
        - tag: component
          value: backup
        - tag: scope
          value: notice
        - tag: group
          value: all
    - uuid: fb065cb052094f1c933cd4429ff84d0e
      expression: last(/DeviceVault Device by HTTP/dv.device.failure_reason_code)=2 and last(/DeviceVault Device by HTTP/dv.device.found)=1 and last(/DeviceVault Device by HTTP/dv.device.enabled)=1 and last(/DeviceVault Device by HTTP/dv.device.lifecycle_code)=0
      recovery_mode: RECOVERY_EXPRESSION
      recovery_expression: last(/DeviceVault Device by HTTP/dv.device.failure_reason_code)<>2 or last(/DeviceVault Device by HTTP/dv.device.found)<>1 or last(/DeviceVault Device by HTTP/dv.device.enabled)<>1 or last(/DeviceVault Device by HTTP/dv.device.lifecycle_code)<>0
      name: 'DeviceVault: backup authentication failing'
      priority: AVERAGE
      description: The latest backup failed because the device refused the login or enable credentials.
      dependencies:
        - name: 'DeviceVault: no data from DeviceVault'
          expression: nodata(/DeviceVault Device by HTTP/dv.device.get,{$DV.DEVICE.NODATA})=1 or last(/DeviceVault Device by HTTP/dv.device.error)="stale"
          recovery_expression: nodata(/DeviceVault Device by HTTP/dv.device.get,{$DV.DEVICE.NODATA})=0 and last(/DeviceVault Device by HTTP/dv.device.error)<>"stale"
      tags:
        - tag: component
          value: backup
        - tag: scope
          value: security
        - tag: group
          value: all
    - uuid: fd6e4d6fb2734e51a26db1a01ef65abd
      expression: '{$DV.DEVICE.STALE.MAX}>0 and last(/DeviceVault Device by HTTP/dv.device.last_success_at)>0 and last(/DeviceVault Device by HTTP/dv.device.last_success_age)>{$DV.DEVICE.STALE.MAX} and last(/DeviceVault Device by HTTP/dv.device.found)=1 and last(/DeviceVault Device by HTTP/dv.device.enabled)=1 and last(/DeviceVault Device by HTTP/dv.device.lifecycle_code)=0'
      recovery_mode: RECOVERY_EXPRESSION
      recovery_expression: '{$DV.DEVICE.STALE.MAX}=0 or last(/DeviceVault Device by HTTP/dv.device.last_success_age)<={$DV.DEVICE.STALE.MAX} or last(/DeviceVault Device by HTTP/dv.device.found)<>1 or last(/DeviceVault Device by HTTP/dv.device.enabled)<>1 or last(/DeviceVault Device by HTTP/dv.device.lifecycle_code)<>0'
      name: 'DeviceVault: no successful backup for {$DV.DEVICE.STALE.MAX}'
      priority: WARNING
      description: A flat threshold on the age of the last successful backup ({$DV.DEVICE.STALE.MAX}, 0 = off).
      dependencies:
