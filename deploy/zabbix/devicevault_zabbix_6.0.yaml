        - uuid: 186b51512b1749d48a1e95c7c6610c39
          name: 'DeviceVault: Data age'
          type: DEPENDENT
          key: dv.device.published_age
          delay: '0'
          value_type: FLOAT
          units: s
          description: Seconds since that snapshot was published
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.published_age
              error_handler: DISCARD_VALUE
          master_item:
            key: dv.device.get
          tags:
            - tag: component
              value: backup
          triggers:
            - uuid: 0f0ee0d3ba0843139e2632e377aea3c4
              expression: last(/DeviceVault Device by HTTP/dv.device.published_age)>{$DV.DEVICE.DATA.MAX}
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: last(/DeviceVault Device by HTTP/dv.device.published_age)<={$DV.DEVICE.DATA.MAX}
              name: 'DeviceVault: DeviceVault data is old'
              priority: WARNING
              description: 'The snapshot answering was published longer ago than {$DV.DEVICE.DATA.MAX}: the orchestrator has stopped publishing while the relay still serves.'
              dependencies:
                - name: 'DeviceVault: no data from DeviceVault'
                  expression: nodata(/DeviceVault Device by HTTP/dv.device.get,{$DV.DEVICE.NODATA})=1 or last(/DeviceVault Device by HTTP/dv.device.error)="stale"
                  recovery_expression: nodata(/DeviceVault Device by HTTP/dv.device.get,{$DV.DEVICE.NODATA})=0 and last(/DeviceVault Device by HTTP/dv.device.error)<>"stale"
              tags:
                - tag: component
                  value: api
                - tag: scope
                  value: availability
                - tag: group
                  value: all
      tags:
        - tag: class
          value: software
        - tag: target
          value: devicevault
      macros:
        - macro: '{$DV.RELAY.URL}'
          value: https://receiver-site-a:8443
          description: The monitoring relay of a receiver in this zone (or {$DV.URL}/api/monitoring for the orchestrator). Set it once per zone on a site template.
        - macro: '{$DV.DEVICE.ID}'
          description: 'DeviceVault''s id for this device, for a host whose interface address is not the one DeviceVault backs up. Empty: match on {HOST.IP}.'
        - macro: '{$DV.DEVICE.INTERVAL}'
          value: 15m
          description: How often the device status is polled (snapshots are published every 15m).
        - macro: '{$DV.DEVICE.NODATA}'
          value: 45m
          description: No answer for this long (three poll intervals) raises the no-data trigger.
        - macro: '{$DV.NOTFOUND.ALERT}'
          value: '1'
          description: 1 reports hosts DeviceVault does not back up; 0 switches that trigger off.
        - macro: '{$DV.DEVICE.FAIL.CONSEC}'
          value: '2'
          description: Consecutive failed backups that raise the failing trigger.
        - macro: '{$DV.DEVICE.STALE.MAX}'
          value: '0'
          description: Raise a trigger when the last successful backup is older than this (for example 2d); 0 switches it off in favour of the schedule-based overdue trigger.
        - macro: '{$DV.DEVICE.DATA.MAX}'
          value: 45m
          description: Raise a trigger when the published snapshot answering is older than this.
      valuemaps:
        - uuid: e9df205963684b62aa3d2152dcef8d53
          name: DeviceVault job status
          mappings:
            - value: '0'
              newvalue: never
            - value: '1'
              newvalue: stored
            - value: '2'
              newvalue: failed
            - value: '3'
              newvalue: timed_out
            - value: '4'
              newvalue: running
        - uuid: fd31acf62a2043608afd3dfff4a5cf74
          name: DeviceVault failure reason
          mappings:
