zabbix_export:
  version: '6.0'
  groups:
    - uuid: e6e21a0925d9472b929b6e4039bdc474
      name: Templates/Applications
  templates:
    - uuid: aa670518836c4d5cb9a3d9772f613cb8
      template: DeviceVault by HTTP
      name: DeviceVault by HTTP
      description: |-
        Backup health of a DeviceVault installation, polled from its read-only monitoring API.

        Link it to one host standing for DeviceVault, monitored by the Zabbix server or a proxy that can reach the web tier.
        Set {$DV.URL} (the web address, without /api) and {$DV.TOKEN} (a service account's token with the monitoring scope,
        plus monitoring_platform for workers, the scheduler, storage targets and receivers) as global macros, or on the host.

        Generated by DeviceVault from its metric catalogue; see DEPLOYMENT.md, section Monitoring.
      groups:
        - name: Templates/Applications
      items:
        - uuid: 7d7afd6b15984fb281a39f1d6c2b15c8
          name: 'DeviceVault: Get summary'
          type: HTTP_AGENT
          key: dv.summary.get
          delay: '{$DV.INTERVAL}'
          history: '0'
          trends: '0'
          value_type: TEXT
          description: Estate outcomes, timing, freshness, change, volume, push and self, and platform health with that scope.
          timeout: 15s
          url: '{$DV.URL}/api/monitoring/summary/'
          headers:
            - name: Authorization
              value: Bearer {$DV.TOKEN}
          tags:
            - tag: component
              value: raw
        - uuid: 68a85968b2444b9fb74b925696c567bc
          name: 'DeviceVault: API status'
          type: HTTP_AGENT
          key: dv.http.status
          delay: '{$DV.INTERVAL}'
          description: The HTTP status the summary endpoint answers with (200 when the token is accepted).
          timeout: 15s
          url: '{$DV.URL}/api/monitoring/summary/'
          status_codes: ''
          headers:
            - name: Authorization
              value: Bearer {$DV.TOKEN}
          retrieve_mode: HEADERS
          preprocessing:
            - type: REGEX
              parameters:
                - ^HTTP\/[\d.]+\s+(\d+)
                - \1
          tags:
            - tag: component
              value: api
          triggers:
            - uuid: ce94da43a52f45239320610816fcc11b
              expression: last(/DeviceVault by HTTP/dv.http.status)<>200 or nodata(/DeviceVault by HTTP/dv.http.status,{$DV.NODATA})=1
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: last(/DeviceVault by HTTP/dv.http.status)=200 and nodata(/DeviceVault by HTTP/dv.http.status,{$DV.NODATA})=0
              name: 'DeviceVault: monitoring API unreachable or refusing'
              opdata: 'HTTP status: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'The summary endpoint did not answer for {$DV.NODATA}, or answered with an error (401 or 403: the token is unknown, revoked, expired, out of its networks or lacks the monitoring scope; 5xx: DeviceVault is failing).'
              tags:
                - tag: component
                  value: api
                - tag: scope
                  value: availability
                - tag: group
                  value: all
        - uuid: 45f498cf445a4118b28b11978cdfde4b
          name: 'DeviceVault: Get device groups'
          type: HTTP_AGENT
          key: dv.group.get
          delay: '{$DV.INTERVAL}'
          history: '0'
          trends: '0'
          value_type: TEXT
          description: The device groups list (device-groups/), read by discovery.
          timeout: 15s
          url: '{$DV.URL}/api/monitoring/device-groups/'
          headers:
            - name: Authorization
              value: Bearer {$DV.TOKEN}
          tags:
            - tag: component
              value: raw
        - uuid: 491432725d07479fa406471c23c82fcb
