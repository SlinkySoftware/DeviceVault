# Runs the same checks as `make check` locally. Required to merge to master
# (the "make check" status), and called by release.yml before publishing.
name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: make check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: make check
