name: devicevault-docker-dev

x-backend-env: &backend-env
  DEVICEVAULT_CONFIG: /workspace/var/docker-dev/config/backend-config.yaml
  DEVICEVAULT_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
  DEVICEVAULT_RESULT_BACKEND: redis://redis:6379/1
  DEVICEVAULT_REDIS_URL: redis://redis:6379/1
  DEVICEVAULT_BROKER_API: http://guest:guest@rabbitmq:15672/api/
  DEVICEVAULT_RESULTS_STREAM: device:results
  DEVICEVAULT_STORAGE_RESULTS_STREAM: storage:results
  DEVICEVAULT_CORS_ALLOW_ALL_ORIGINS: "false"
  DEVICEVAULT_CORS_ALLOWED_ORIGINS: http://localhost:9000,http://127.0.0.1:9000

x-backend-volumes: &backend-volumes
  - ../:/workspace
  - ../var/docker-dev/logs:/var/devicevault/logs
  - ../var/docker-dev/storage:/var/devicevault/storage

services:
  db:
    image: postgres:17
    container_name: devicevault-docker-dev-db
    environment:
      POSTGRES_DB: devicevault
      POSTGRES_USER: devicevault
      POSTGRES_PASSWORD: devicevault
    ports:
      - "5432:5432"
    volumes:
      - ../var/docker-dev/postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devicevault -d devicevault"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: devicevault-docker-dev-redis
    command: ["redis-server", "--appendonly", "yes", "--bind", "0.0.0.0"]
    ports:
      - "6379:6379"
    volumes:
      - ../var/docker-dev/redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: devicevault-docker-dev-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ../var/docker-dev/rabbitmq/data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  orchestrator:
    build:
      context: ..
      dockerfile: dev-env/Dockerfile.backend-dev
    container_name: devicevault-docker-dev-orchestrator
    working_dir: /workspace/orchestrator
    environment:
      <<: *backend-env
      DEVICEVAULT_LOG_DIR: /var/devicevault/logs/orchestrator
    command: ["bash", "/workspace/dev-env/scripts/docker-dev-orchestrator.sh"]
    ports:
      - "8000:8000"
    volumes: *backend-volumes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  collector-1:
    build:
      context: ..
      dockerfile: dev-env/Dockerfile.backend-dev
    container_name: devicevault-docker-dev-collector-1
    working_dir: /workspace/orchestrator
    environment: *backend-env
    command:
      - bash
      - -c
      - >
        set -o pipefail &&
        mkdir -p /var/devicevault/logs/collector-1 &&
        celery -A celery_app worker
        -Q default,collector.group.dmz_zone_queue,collector.group.secure_zone_queue
        -l info --concurrency=1 --max-tasks-per-child=100
        -n collector-1@%h
        2>&1 | tee -a /var/devicevault/logs/collector-1/worker.log
    volumes: *backend-volumes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  collector-2:
    build:
      context: ..
      dockerfile: dev-env/Dockerfile.backend-dev
    container_name: devicevault-docker-dev-collector-2
    working_dir: /workspace/orchestrator
    environment: *backend-env
    command:
      - bash
      - -c
      - >
        set -o pipefail &&
        mkdir -p /var/devicevault/logs/collector-2 &&
        celery -A celery_app worker
        -Q default,collector.group.dmz_zone_queue,collector.group.secure_zone_queue
        -l info --concurrency=1 --max-tasks-per-child=100
        -n collector-2@%h
        2>&1 | tee -a /var/devicevault/logs/collector-2/worker.log
    volumes: *backend-volumes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  storage-worker:
    build:
      context: ..
      dockerfile: dev-env/Dockerfile.backend-dev
    container_name: devicevault-docker-dev-storage-worker
    working_dir: /workspace/orchestrator
    environment: *backend-env
    command:
      - bash
      - -c
      - >
        set -o pipefail &&
        mkdir -p /var/devicevault/logs/storage-worker &&
        celery -A celery_app worker
        -Q storage.fs,storage.git
        -l info --concurrency=1 --max-tasks-per-child=100
        -n storage-worker@%h
        2>&1 | tee -a /var/devicevault/logs/storage-worker/worker.log
    volumes: *backend-volumes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  flower:
    build:
      context: ..
      dockerfile: dev-env/Dockerfile.backend-dev
    container_name: devicevault-docker-dev-flower
    working_dir: /workspace/orchestrator
    environment: *backend-env
    command:
      - bash
      - -c
      - >
        set -o pipefail &&
        mkdir -p /var/devicevault/logs/flower &&
        celery -A celery_app flower --address=0.0.0.0 --port=5555
        --broker-api=http://guest:guest@rabbitmq:15672/api/
        2>&1 | tee -a /var/devicevault/logs/flower/flower.log
    ports:
      - "5555:5555"
    volumes: *backend-volumes
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: node:24-bookworm-slim
    container_name: devicevault-docker-dev-frontend
    working_dir: /workspace/frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
      CHOKIDAR_USEPOLLING: "true"
    command:
      - bash
      - -c
      - >
        set -o pipefail &&
        npm install --no-audit --no-fund &&
        mkdir -p /var/devicevault/logs/frontend &&
        npm run dev
        2>&1 | tee -a /var/devicevault/logs/frontend/frontend.log
    ports:
      - "9000:9000"
    volumes:
      - ../frontend:/workspace/frontend
      - ../var/docker-dev/frontend/node_modules:/workspace/frontend/node_modules
      - ../var/docker-dev/logs:/var/devicevault/logs
    depends_on:
      orchestrator:
        condition: service_started
