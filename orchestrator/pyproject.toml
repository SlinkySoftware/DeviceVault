[project]
name = "devicevault-orchestrator"
version = "0.1.0"
description = "DeviceVault orchestrator: API, scheduling and result processing"
requires-python = ">=3.14,<3.15"
license = "GPL-3.0-or-later"
dependencies = [
    "authlib>=1.6",
    "celery[redis]>=5.6.3,<5.7",
    "cronsim>=2.6",
    "devicevault-protocol",
    "django>=6.1.2,<6.2",
    "djangorestframework>=3.18.3,<3.19",
    "flower>=2.2,<2.3",
    "google-re2>=1.1.20251105",
    "gunicorn>=23",
    "joserfc>=1.7",
    "jsonschema>=4.25",
    "kombu>=5.6.2,<5.7",
    "psycopg[binary]>=3.3.6,<3.4",
    "pydantic>=2.14,<3",
    "python-ldap>=3.4.5",
    "pyyaml>=6.0.3",
    "requests>=2.32",
    "whitenoise>=6.11",
]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.32",
    "pytest>=9",
    "pytest-django>=4.11",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.uv.sources]
devicevault-protocol = { workspace = true }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "devicevault.test_settings"
python_files = ["test_*.py", "tests.py"]
addopts = "-ra --strict-markers"
