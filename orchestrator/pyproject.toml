[project]
name = "devicevault-orchestrator"
version = "0.1.0"
description = "DeviceVault orchestrator: API, scheduling and result processing"
requires-python = ">=3.14,<3.15"
license = "GPL-3.0-or-later"
dependencies = [
    "celery[redis]>=5.6.3,<5.7",
    "cronsim>=2.6",
    "devicevault-protocol",
    "django>=6.1.2,<6.2",
    "djangorestframework>=3.18.3,<3.19",
    "flower>=2.2,<2.3",
    "gunicorn>=23",
    "kombu>=5.6.2,<5.7",
    "psycopg[binary]>=3.3.6,<3.4",
    "whitenoise>=6.11",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-django>=4.11",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.uv.sources]
devicevault-protocol = { workspace = true }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "devicevault.test_settings"
python_files = ["test_*.py", "tests.py"]
addopts = "-ra --strict-markers"
