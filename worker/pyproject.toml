[project]
name = "devicevault-worker"
version = "0.1.0"
description = "DeviceVault collection and storage worker"
requires-python = ">=3.14,<3.15"
license = "GPL-3.0-or-later"
dependencies = [
    "boto3>=1.40",
    "celery[redis]>=5.6.3,<5.7",
    "devicevault-protocol",
    "gitpython>=3.1.45",
    "kombu>=5.6.2,<5.7",
    "netmiko>=4.6,<5",
    "paramiko>=4",
    "pydantic>=2.14,<3",
    "python-json-logger>=4",
]

[tool.uv.sources]
devicevault-protocol = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
