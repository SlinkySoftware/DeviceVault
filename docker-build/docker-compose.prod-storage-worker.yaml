name: ${COMPOSE_PROJECT_NAME:-devicevault-storage-worker}

services:
  storage-worker:
    image: ${DEVICEVAULT_APP_IMAGE}
    restart: unless-stopped
    env_file:
      - ${DEVICEVAULT_ENV_FILE}
    environment:
      DEVICEVAULT_CONFIG: ${DEVICEVAULT_CONFIG_DIR}/config.yaml
    volumes:
      - ${DEVICEVAULT_CONFIG_DIR}:${DEVICEVAULT_CONFIG_DIR}:ro
      - ${DEVICEVAULT_STORAGE_HOST_PATH}:${DEVICEVAULT_STORAGE_CONTAINER_PATH}
    command: >
      sh -c "exec celery -A celery_app worker
      --loglevel=info
      --queues=$${DEVICEVAULT_STORAGE_QUEUES:-storage.fs,storage.git}
      --concurrency=$${DEVICEVAULT_STORAGE_CONCURRENCY:-2}
      --hostname=storage@%h"
