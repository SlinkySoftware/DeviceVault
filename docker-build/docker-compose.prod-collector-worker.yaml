name: ${COMPOSE_PROJECT_NAME:-devicevault-collector-worker}

services:
  collector-worker:
    image: ${DEVICEVAULT_APP_IMAGE}
    restart: unless-stopped
    env_file:
      - ${DEVICEVAULT_ENV_FILE}
    environment:
      DEVICEVAULT_CONFIG: ${DEVICEVAULT_CONFIG_DIR}/config.yaml
    volumes:
      - ${DEVICEVAULT_CONFIG_DIR}:${DEVICEVAULT_CONFIG_DIR}:ro
    command: >
      sh -c "exec celery -A devicevault_worker worker
      --loglevel=info
      --queues=$${DEVICEVAULT_COLLECTOR_QUEUES}
      --concurrency=$${DEVICEVAULT_COLLECTOR_CONCURRENCY:-4}
      --hostname=collector@%h"
