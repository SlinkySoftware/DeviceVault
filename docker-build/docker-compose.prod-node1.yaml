version: '3.8'

name: devicevault-prod-node1

services:
  # PRIMARY DATABASE
  postgres:
    image: postgres:17
    container_name: postgres-1
    hostname: postgres-1
    restart: unless-stopped
    env_file:
      - /etc/devicevault/node1/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devicevault}
      POSTGRES_USER: ${POSTGRES_USER:-devicevault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: >
        --encoding=UTF8
        --wal-level=replica
        --max_wal_senders=3
        --max_replication_slots=3
    volumes:
      - postgres-data-1:/var/lib/postgresql/data
      - /etc/devicevault/node1/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - devicevault-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devicevault}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PRIMARY REDIS (MASTER)
  redis:
    image: redis:7
    container_name: redis-1
    hostname: redis-1
    restart: unless-stopped
    command:
      - redis-server
      - --bind
      - 0.0.0.0
      - --appendonly
      - "yes"
      - --maxmemory
      - "2gb"
      - --maxmemory-policy
      - "allkeys-lru"
    volumes:
      - redis-data-1:/data
    ports:
      - "6379:6379"
    networks:
      - devicevault-prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PRIMARY RABBITMQ (CLUSTER NODE)
  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    container_name: rabbitmq-1
    hostname: rabbitmq-1
    restart: unless-stopped
    env_file:
      - /etc/devicevault/node1/.env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-devicevault-cookie}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq-data-1:/var/lib/rabbitmq
      - /etc/devicevault/node1/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    networks:
      - devicevault-prod
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping", "-q"]
      interval: 10s
      timeout: 5s
      retries: 5

  # DJANGO APPLICATION + NGINX
  django:
    build:
      context: /opt/devicevault/repo/docker-build
      dockerfile: Dockerfile.django
      args:
        - GIT_BRANCH=${GIT_BRANCH:-master}
    container_name: django-1
    hostname: django-1
    restart: unless-stopped
    env_file:
      - /etc/devicevault/node1/.env
    environment:
      DEVICEVAULT_CONFIG: /etc/devicevault/node1/config.yaml
      DEVICEVAULT_BROKER_URL: ${DEVICEVAULT_BROKER_URL:-amqp://guest:guest@rabbitmq:5672//}
      DEVICEVAULT_REDIS_URL: ${DEVICEVAULT_REDIS_URL:-redis://redis:6379/1}
      DEVICEVAULT_BROKER_API: ${DEVICEVAULT_BROKER_API:-http://guest:guest@rabbitmq:15672/api/}
      DEBUG: "${DEBUG:-False}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - /etc/devicevault/node1:/etc/devicevault/node1:ro
      - django-static:/app/static
    ports:
      - "8000:8000"
    networks:
      - devicevault-prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: >
      sh -c "
      cd /app/repo/backend &&
      python manage.py migrate --run-syncdb &&
      gunicorn -w 4 -b 0.0.0.0:8000 devicevault.wsgi:application
      "

  nginx:
    build:
      context: /opt/devicevault/repo/docker-build
      dockerfile: Dockerfile.nginx
      args:
        - GIT_BRANCH=${GIT_BRANCH:-master}
    container_name: nginx-1
    hostname: nginx-1
    restart: unless-stopped
    depends_on:
      - django
    volumes:
      - /etc/devicevault/node1/nginx.conf:/etc/nginx/nginx.conf:ro
      - django-static:/app/static:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - devicevault-prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # CELERY BACKUP WORKER
  celery-backup-worker:
    build:
      context: /opt/devicevault/repo/docker-build
      dockerfile: Dockerfile.celery
      args:
        - GIT_BRANCH=${GIT_BRANCH:-master}
    container_name: celery-backup-worker-1
    hostname: celery-backup-worker-1
    restart: unless-stopped
    env_file:
      - /etc/devicevault/node1/.env
    environment:
      DEVICEVAULT_CONFIG: /etc/devicevault/node1/config.yaml
      DEVICEVAULT_BROKER_URL: ${DEVICEVAULT_BROKER_URL:-amqp://guest:guest@rabbitmq:5672//}
      DEVICEVAULT_REDIS_URL: ${DEVICEVAULT_REDIS_URL:-redis://redis:6379/1}
      DEVICEVAULT_BROKER_API: ${DEVICEVAULT_BROKER_API:-http://guest:guest@rabbitmq:15672/api/}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - /etc/devicevault/node1:/etc/devicevault/node1:ro
      - backup-storage:/backupstorage
    networks:
      - devicevault-prod
    command: >
      celery -A backend.celery_app worker
      --loglevel=info
      --concurrency=4
      --queues=backup

  # CELERY STORAGE WORKER
  celery-storage-worker:
    build:
      context: /opt/devicevault/repo/docker-build
      dockerfile: Dockerfile.celery
      args:
        - GIT_BRANCH=${GIT_BRANCH:-master}
    container_name: celery-storage-worker-1
    hostname: celery-storage-worker-1
    restart: unless-stopped
    env_file:
      - /etc/devicevault/node1/.env
    environment:
      DEVICEVAULT_CONFIG: /etc/devicevault/node1/config.yaml
      DEVICEVAULT_BROKER_URL: ${DEVICEVAULT_BROKER_URL:-amqp://guest:guest@rabbitmq:5672//}
      DEVICEVAULT_REDIS_URL: ${DEVICEVAULT_REDIS_URL:-redis://redis:6379/1}
      DEVICEVAULT_BROKER_API: ${DEVICEVAULT_BROKER_API:-http://guest:guest@rabbitmq:15672/api/}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - /etc/devicevault/node1:/etc/devicevault/node1:ro
      - backup-storage:/backupstorage
    networks:
      - devicevault-prod
    command: >
      celery -A backend.celery_app worker
      --loglevel=info
      --concurrency=4
      --queues=storage

  # BACKUP RESULT CONSUMER
  backup-consumer:
    image: python:3.11-slim
    container_name: backup-consumer-1
    hostname: backup-consumer-1
    restart: unless-stopped
    env_file:
      - /etc/devicevault/node1/.env
    environment:
      DEVICEVAULT_CONFIG: /etc/devicevault/node1/config.yaml
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /etc/devicevault/node1:/etc/devicevault/node1:ro
      - /opt/devicevault/repo:/app:ro
    networks:
      - devicevault-prod
    working_dir: /app/backend
    command: >
      sh -c "
      pip install -q -r requirements.txt &&
      python start-backup-consumer.sh
      "

  # STORAGE RESULT CONSUMER
  storage-consumer:
    image: python:3.11-slim
    container_name: storage-consumer-1
    hostname: storage-consumer-1
    restart: unless-stopped
    env_file:
      - /etc/devicevault/node1/.env
    environment:
      DEVICEVAULT_CONFIG: /etc/devicevault/node1/config.yaml
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /etc/devicevault/node1:/etc/devicevault/node1:ro
      - /opt/devicevault/repo:/app:ro
    networks:
      - devicevault-prod
    working_dir: /app/backend
    command: >
      sh -c "
      pip install -q -r requirements.txt &&
      python start-storage-consumer.sh
      "

  # FLOWER (CELERY MONITORING) - Optional but recommended
  flower:
    image: mher/flower:2.0
    container_name: flower-1
    hostname: flower-1
    restart: unless-stopped
    environment:
      CELERY_BROKER_URL: ${DEVICEVAULT_BROKER_URL:-amqp://guest:guest@rabbitmq:5672//}
      CELERY_RESULT_BACKEND: ${DEVICEVAULT_REDIS_URL:-redis://redis:6379/1}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "5555:5555"
    networks:
      - devicevault-prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  devicevault-prod:
    driver: bridge

volumes:
  postgres-data-1:
  redis-data-1:
  rabbitmq-data-1:
  django-static:
  backup-storage:
