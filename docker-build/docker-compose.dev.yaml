# DeviceVault Development Services
# This compose file provides only the backing services (Redis & RabbitMQ) for local development.
# The Django backend, frontend, and workers run natively via devicevault.sh script.

name: devicevault-dev

services:
  redis:
    image: redis:7-alpine
    container_name: devicevault-dev-redis
    command: ["redis-server", "--bind", "0.0.0.0"]
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: devicevault-dev-rabbitmq
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-dev-data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-dev-data:
    name: devicevault-dev-redis-data
  rabbitmq-dev-data:
    name: devicevault-dev-rabbitmq-data
