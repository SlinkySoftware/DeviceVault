version: '3.8'

name: devicevault-prod-collector-group2

services:
  # COLLECTOR GROUP 2 - WORKER 1
  celery-worker-1:
    build:
      context: /opt/devicevault/repo/docker-build
      dockerfile: Dockerfile.celery
      args:
        - GIT_BRANCH=${GIT_BRANCH:-master}
    container_name: collector-group2-worker-1
    hostname: collector-group2-worker-1
    restart: unless-stopped
    env_file:
      - /etc/devicevault/collectors/group2/.env
    environment:
      DEVICEVAULT_CONFIG: /etc/devicevault/collectors/group2/config.yaml
      DEVICEVAULT_BROKER_URL: ${DEVICEVAULT_BROKER_URL:-amqp://guest:guest@node1.internal:5672//}
      DEVICEVAULT_REDIS_URL: ${DEVICEVAULT_REDIS_URL:-redis://node1.internal:6379/1}
      DEVICEVAULT_BROKER_API: ${DEVICEVAULT_BROKER_API:-http://guest:guest@node1.internal:15672/api/}
      PYTHONUNBUFFERED: "1"
    volumes:
      - /etc/devicevault/collectors/group2:/etc/devicevault/collectors/group2:ro
      - backup-storage:/backupstorage
    networks:
      - devicevault-prod
    command: >
      celery -A backend.celery_app worker
      --loglevel=info
      --concurrency=4
      --queues=collector.group.group2
      --hostname=collector-group2-worker-1@%%h
    depends_on:
      - redis

  # COLLECTOR GROUP 2 - WORKER 2
  celery-worker-2:
    build:
      context: /opt/devicevault/repo/docker-build
      dockerfile: Dockerfile.celery
      args:
        - GIT_BRANCH=${GIT_BRANCH:-master}
    container_name: collector-group2-worker-2
    hostname: collector-group2-worker-2
    restart: unless-stopped
    env_file:
      - /etc/devicevault/collectors/group2/.env
    environment:
      DEVICEVAULT_CONFIG: /etc/devicevault/collectors/group2/config.yaml
      DEVICEVAULT_BROKER_URL: ${DEVICEVAULT_BROKER_URL:-amqp://guest:guest@node1.internal:5672//}
      DEVICEVAULT_REDIS_URL: ${DEVICEVAULT_REDIS_URL:-redis://node1.internal:6379/1}
      DEVICEVAULT_BROKER_API: ${DEVICEVAULT_BROKER_API:-http://guest:guest@node1.internal:15672/api/}
      PYTHONUNBUFFERED: "1"
    volumes:
      - /etc/devicevault/collectors/group2:/etc/devicevault/collectors/group2:ro
      - backup-storage:/backupstorage
    networks:
      - devicevault-prod
    command: >
      celery -A backend.celery_app worker
      --loglevel=info
      --concurrency=4
      --queues=collector.group.group2
      --hostname=collector-group2-worker-2@%%h
    depends_on:
      - redis

  # COLLECTOR GROUP 2 - WORKER 3 (Optional, for higher concurrency)
  celery-worker-3:
    build:
      context: /opt/devicevault/repo/docker-build
      dockerfile: Dockerfile.celery
      args:
        - GIT_BRANCH=${GIT_BRANCH:-master}
    container_name: collector-group2-worker-3
    hostname: collector-group2-worker-3
    restart: unless-stopped
    env_file:
      - /etc/devicevault/collectors/group2/.env
    environment:
      DEVICEVAULT_CONFIG: /etc/devicevault/collectors/group2/config.yaml
      DEVICEVAULT_BROKER_URL: ${DEVICEVAULT_BROKER_URL:-amqp://guest:guest@node1.internal:5672//}
      DEVICEVAULT_REDIS_URL: ${DEVICEVAULT_REDIS_URL:-redis://node1.internal:6379/1}
      DEVICEVAULT_BROKER_API: ${DEVICEVAULT_BROKER_API:-http://guest:guest@node1.internal:15672/api/}
      PYTHONUNBUFFERED: "1"
    volumes:
      - /etc/devicevault/collectors/group2:/etc/devicevault/collectors/group2:ro
      - backup-storage:/backupstorage
    networks:
      - devicevault-prod
    command: >
      celery -A backend.celery_app worker
      --loglevel=info
      --concurrency=4
      --queues=collector.group.group2
      --hostname=collector-group2-worker-3@%%h
    depends_on:
      - redis

  # LOCAL REDIS CACHE (Optional - for local result caching if connectivity issues)
  redis:
    image: redis:7
    container_name: redis-collector-group2
    hostname: redis-collector-group2
    restart: unless-stopped
    command:
      - redis-server
      - --bind
      - 127.0.0.1
      - --maxmemory
      - "512mb"
    volumes:
      - redis-local-cache:/data
    networks:
      - devicevault-prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  devicevault-prod:
    driver: bridge

volumes:
  backup-storage:
    driver: local
    driver_opts:
      type: nfs
      o: addr=nfs.internal,vers=4,soft,timeo=180,bg,tcp,rw
      device: ":/export/devicevault/backups"
  redis-local-cache:
