[tool.uv.workspace]
members = ["protocol", "worker", "receiver", "orchestrator"]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501", # line length is handled by the formatter
    "E402", # license blocks follow module docstrings
]

[tool.ruff.lint.isort]
known-first-party = [
    "accounts", "api", "audit", "backups", "core", "credentials", "devices", "devicevault",
    "devicevault_protocol", "devicevault_receiver", "devicevault_worker", "monitoring", "policies", "push", "storage",
]

[tool.ruff.format]
quote-style = "single"
